<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/img/icon-safisa.ico" type="image/x-icon">
  <title>SAFISA | Acessos</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="portal-page">
  <main class="portal-shell">
    <header class="portal-header">
      <span class="section-pill">Acessos</span>
      <h1 class="portal-title">Escolha sua area</h1>
      <p class="portal-subtitle">Separe o fluxo operacional da administracao para trabalhar com mais clareza.</p>
    </header>

    <section class="portal-grid portal-grid-two">
      <a class="portal-card" href="/pagina-operacao">
        <span class="portal-card-kicker">Fluxo do dia</span>
        <h2>Operacao</h2>
        <p>Producao, Almoxarifado, Montagem, Expedicao e Tratamento Externo.</p>
      </a>

      <a class="portal-card" href="/pagina-adm">
        <span class="portal-card-kicker">Gestao</span>
        <h2>ADM</h2>
        <p>Cadastros, Dashboard e Remessas / NF em um acesso separado.</p>
      </a>
    </section>

    <div class="portal-actions">
      <a class="btn btn-neutral" href="/pagina-inicial">Voltar</a>
    </div>
  </main>
</body>
</html>
