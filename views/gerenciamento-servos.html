<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/img/icon-safisa.ico" type="image/x-icon">
  <title>SAFISA | Gerenciamento de Servos</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="servo-sheet-page-body">
  <main class="workspace servo-sheet-page">
    <div id="ger-servos-mensagem" class="message hidden"></div>

    <section class="content-card servo-sheet-shell">
      <div class="servo-sheet-toolbar">
        <div class="servo-sheet-toolbar-copy">
          <span class="section-pill">Planilha</span>
          <h1 class="servo-sheet-page-title">Gerenciamento de Servos</h1>
        </div>

        <div class="servo-sheet-toolbar-actions">
          <a class="servo-sheet-action-btn is-neutral" href="/pagina-montagem" title="Voltar para Montagem">
            <span class="servo-sheet-action-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 18l-6-6 6-6"></path>
              </svg>
            </span>
            <span>Voltar</span>
          </a>
          <button id="ger-servos-btn-atualizar" class="servo-sheet-action-btn is-blue" type="button" title="Atualizar planilha">
            <span class="servo-sheet-action-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 10-3.3 6.94"></path>
                <path d="M21 3v6h-6"></path>
              </svg>
            </span>
            <span>Atualizar</span>
          </button>
          <button id="ger-servos-btn-imprimir" class="servo-sheet-action-btn is-orange" type="button" title="Imprimir planilha">
            <span class="servo-sheet-action-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 9V4h12v5"></path>
                <path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"></path>
                <path d="M6 14h12v6H6z"></path>
              </svg>
            </span>
            <span>Imprimir</span>
          </button>
        </div>
      </div>

      <div class="servo-sheet-panel-head">
        <div>
          <h2 id="ger-servos-titulo">Consulta de demanda e cobertura</h2>
        </div>

        <div class="segmented-control servo-sheet-scope-switch">
          <button id="ger-servos-btn-dia" class="segmented-btn" type="button">Pedidos do dia</button>
          <button id="ger-servos-btn-global" class="segmented-btn is-active" type="button">Global</button>
        </div>
      </div>

      <div class="servo-sheet-wrapper" data-print-table data-print-title="Gerenciamento de Servos">
        <table class="servo-sheet-table" id="ger-servos-tabela">
          <thead id="ger-servos-thead">
            <tr>
              <th class="sticky-col servo-sheet-model-col">Modelo</th>
              <th class="servo-sheet-total-col">Total</th>
            </tr>
          </thead>
          <tbody id="ger-servos-tbody">
            <tr>
              <td colspan="2" class="empty-state">Carregando planilha...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/js/number-input-guard.js"></script>
  <script src="/js/gerenciamento-servos.js?v=20260826-calculo-mbf015"></script>
</body>
</html>
